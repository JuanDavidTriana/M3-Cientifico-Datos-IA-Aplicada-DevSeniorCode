services:
  modelo-base:
    build:
      context: ./servicio_baseline
    container_name: clase02-modelo-base
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  modelo-optimizado:
    build:
      context: ./servicio_optimizado
    container_name: clase02-modelo-optimizado
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
